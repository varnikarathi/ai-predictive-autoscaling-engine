<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#strokeGrad)" stroke-width="2"/>
  
  <!-- Server / Metric Scaling Bars -->
  <rect x="14" y="36" width="7" height="16" rx="2.5" fill="#3b82f6" fill-opacity="0.45"/>
  <rect x="25" y="28" width="7" height="24" rx="2.5" fill="#38bdf8" fill-opacity="0.7"/>
  <rect x="36" y="20" width="7" height="32" rx="2.5" fill="#10b981" fill-opacity="0.9"/>

  <!-- AI Prediction Pulse Line -->
  <path d="M 12 40 Q 22 36 28 26 T 46 16 L 52 14" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Predictive Node / Target Indicator -->
  <circle cx="46" cy="16" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="46" cy="16" r="1.5" fill="#ffffff"/>
  
  <!-- Proactive Scaling Accent -->
  <path d="M 44 26 L 41 33 H 47 L 43 42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

